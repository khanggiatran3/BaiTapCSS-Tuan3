
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 5 - CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .best-shared {
            text-align: center;
            padding: 20px;
        }

        .logo img {
            width: 200px;
        }

        h2 {
            font-size: 30px;
            font-weight: normal;
            color: #333;
        }

        h2 strong {
            color: #00AEEF;
        }

        .lead-text {
            font-size: 13px;
            color: #666;
            margin: 25px 0;
        }

        .btn-list {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        .btn-list li {
            display: inline-block;
            margin: 0 5px;
        }

        .btn-list a {
            display: inline-block;
            width: 95px;
            padding: 15px;
            background-color: #292c2f;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <section class="best-shared">

        <p class="logo">
            <img src="images/logo-bit.png" alt="BIT Logo">
        </p>

        <h2>Best <strong>Shared Hosting</strong> Company</h2>

        <p class="lead-text">
            With this responsive landing page template, you can promote your all hosting, domain and email services.
        </p>

        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>

    </section>

</body>
</html>
